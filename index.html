<!DOCTYPE html>
<!-- 每次改版：把下面 data-build 換成新的版本字串（例如日期＋序號），存檔部署即可 -->
<!-- 註：裝了 Service Worker 之後，更新其實已自動處理；這個版本號主要當「畫面上的版本標籤」＋備援用 -->
<html lang="zh-Hant" data-build="2026-08-27-1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>白光工具箱</title>
<meta name="theme-color" content="#F5F6F4">
<!-- 讓「加入主畫面」後像 App 一樣全螢幕開啟 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="白光工具箱">
<!-- 圖示：分頁小圖 / iOS 主畫面 / Android 主畫面（皆放在 repo 根目錄） -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* —— 白光：乾淨的日光白，不是奶油色 —— */
    --paper:#F5F6F4;
    --card:#FFFFFF;
    --ink:#191A1C;
    --ink-soft:#4B4D50;
    --muted:#8B8D8A;
    --line:#E6E7E3;
    /* —— 稜鏡分光：每個工具各自一個色相 —— */
    --c-brew:#DC5B3B;    /* 調煮 · 烘焙紅 */
    --c-bean:#8C5A34;    /* 咖啡豆品管 · 咖啡棕 */
    --c-order:#E39A2B;   /* 進貨 · 琥珀 */
    --c-shift:#4F86C0;   /* 排班 · 藍 */
    --c-video:#9A5AA6;   /* 影片 · 紫 */
    --c-stock:#1FA98A;   /* 物控 · 青綠 */
    --c-save:#2E9E5B;    /* 存款登錄 · 綠 */
    --serif:"Noto Serif TC",serif;
    --sans:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
    padding:
      calc(env(safe-area-inset-top) + 34px)
      20px
      calc(env(safe-area-inset-bottom) + 40px);
    display:flex;
    justify-content:center;
  }
  .wrap{width:100%;max-width:480px}

  /* ---------- 標頭 ---------- */
  header{margin-bottom:24px}
  .eyebrow{
    font-size:12px;font-weight:500;letter-spacing:.22em;
    color:var(--muted);text-transform:uppercase;margin:0 0 10px;
  }
  h1{
    font-family:var(--serif);font-weight:700;
    font-size:40px;line-height:1.05;letter-spacing:.01em;
    margin:0;color:var(--ink);
  }
  .tagline{margin:12px 0 0;font-size:15px;color:var(--ink-soft)}
  /* 稜鏡光譜：這頁的記憶點 */
  .spectrum{
    height:4px;border-radius:99px;margin-top:20px;transform-origin:left center;
    background:linear-gradient(90deg,var(--c-order) 0%,var(--c-brew) 52%,var(--c-stock) 100%);
  }

  /* ---------- 分類區塊 ---------- */
  .tools-nav{margin-top:26px}
  .group + .group{margin-top:26px}
  .group-title{
    display:flex;align-items:center;gap:9px;
    margin:0 0 12px 2px;
    font-family:var(--sans);font-size:13px;font-weight:700;
    letter-spacing:.14em;color:var(--ink-soft);
  }
  .group-title .dot{
    width:9px;height:9px;border-radius:99px;flex:0 0 auto;
    background:var(--gc,var(--muted));
  }

  /* ---------- 工具卡 ---------- */
  .tools{display:flex;flex-direction:column;gap:12px}
  .tool{
    --hue:var(--muted);
    display:flex;align-items:center;gap:16px;
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:18px 18px 18px 20px;min-height:80px;
    text-decoration:none;color:inherit;position:relative;overflow:hidden;
    transition:transform .12s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .tool::before{ /* 左側色脊 */
    content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--hue);
  }
  .tool:active{transform:scale(.985)}
  @media (hover:hover){
    .tool:hover{box-shadow:0 8px 24px rgba(25,26,28,.08);border-color:color-mix(in srgb,var(--hue) 45%,var(--line))}
  }
  .tool:focus-visible{outline:2.5px solid var(--hue);outline-offset:3px}

  .ico{
    flex:0 0 auto;width:46px;height:46px;border-radius:13px;
    display:grid;place-items:center;
    background:color-mix(in srgb,var(--hue) 14%,#fff);
    color:var(--hue);
  }
  .ico svg{width:24px;height:24px;display:block}

  .body{flex:1;min-width:0}
  .name{font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.2;letter-spacing:.01em}
  .desc{font-size:13.5px;color:var(--muted);margin-top:3px}

  .go{flex:0 0 auto;color:var(--hue);font-size:22px;line-height:1;transform:translateX(0);transition:transform .16s ease}
  @media (hover:hover){ .tool:hover .go{transform:translateX(4px)} }

  /* 尚未設定連結的空狀態 */
  .tool.todo{cursor:default;background:#fbfbfa}
  .tool.todo .name{color:var(--ink-soft)}
  .tool.todo .desc{color:var(--muted)}
  .tool.todo .go{display:none}
  .tool.todo:active{transform:none}

  /* ---------- 主畫面提示 ---------- */
  .tip{
    margin-top:28px;padding:16px 18px;border-radius:14px;
    background:color-mix(in srgb,var(--c-order) 8%,#fff);
    border:1px solid color-mix(in srgb,var(--c-order) 22%,var(--line));
    font-size:13.5px;color:var(--ink-soft);
  }
  .tip b{color:var(--ink);font-weight:700}
  .tip .how{margin-top:6px;color:var(--muted);font-size:12.5px}

  /* ---------- 強制更新按鈕（備援用，可留可刪） ---------- */
  .updatebar{margin-top:22px;text-align:center}
  .refresh{
    display:inline-flex;align-items:center;gap:7px;
    padding:9px 16px;border-radius:999px;cursor:pointer;
    background:#fff;border:1px solid var(--line);color:var(--ink-soft);
    font-family:var(--sans);font-size:13px;font-weight:500;
    transition:border-color .16s ease,color .16s ease,transform .12s ease;
  }
  .refresh svg{width:16px;height:16px;display:block}
  .refresh:active{transform:scale(.97)}
  @media (hover:hover){
    .refresh:hover{border-color:color-mix(in srgb,var(--c-stock) 45%,var(--line));color:var(--ink)}
  }
  .buildtag{display:block;margin-top:9px;color:var(--muted);font-size:11px;letter-spacing:.06em}

  footer{margin-top:22px;text-align:center;color:var(--muted);font-size:12px;letter-spacing:.04em}

  /* ---------- 更新提示小訊息 ---------- */
  .wl-toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);
    transform:translateX(-50%);z-index:9999;
    background:var(--ink);color:#fff;
    font-family:var(--sans);font-size:14px;font-weight:500;line-height:1.4;
    padding:10px 18px;border-radius:999px;
    box-shadow:0 8px 24px rgba(25,26,28,.28);
    opacity:0;transition:opacity .2s ease;
  }

  /* ---------- 載入動態（尊重減少動態設定） ---------- */
  @media (prefers-reduced-motion:no-preference){
    .spectrum{animation:grow .7s .1s cubic-bezier(.2,.7,.2,1) both}
    .group{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
    .group:nth-of-type(1){animation-delay:.16s}
    .group:nth-of-type(2){animation-delay:.26s}
    .group:nth-of-type(3){animation-delay:.36s}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>

<script>
  // 還沒貼網址的卡片，自動變成「尚未設定」狀態，避免夥伴點到空連結。
  document.querySelectorAll('.tool').forEach(function(a){
    var href = a.getAttribute('href') || '';
    if(href.indexOf('PASTE_') === 0 || href === '' || href === '#'){
      a.classList.add('todo');
      a.removeAttribute('href');
      var desc = a.querySelector('.desc');
      if(desc) desc.textContent = '尚未設定連結';
    }
  });
</script>

<!-- ============ 白光 自動更新（主力）：Service Worker，一律先連網路 ============ -->
<!-- 需要在這個 repo 根目錄放一支 sw.js（跟本頁同一層）。 -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
        .then(function (reg) {
          // 每次從主畫面切回前景，順手檢查 sw.js 有沒有新版
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') reg.update();
          });
        })
        .catch(function () { /* 不支援就算了，還有下面的備援 */ });
    });
  }
</script>

<!-- ============ 白光 自動更新（備援）：比對版本 + 手動按鈕 ============ -->
<!-- 萬一某裝置沒跑 Service Worker（少數舊 iOS），這段仍會用「不透過快取」的方式 -->
<!-- 抓最新原始碼，比對 <html data-build>，不一樣就自己重載最新版。 -->
<script>
(function () {
  var html  = document.documentElement;
  var BUILD = html.getAttribute('data-build') || '';
  var SELF  = location.pathname; // 這一頁（不含 ?query）

  var tag = document.getElementById('buildTag');
  if (tag) tag.textContent = '版本 ' + (BUILD || '—');

  function latestBuildFrom(text){
    var m = text.match(/<html[^>]*\sdata-build="([^"]*)"/i);
    return m ? m[1] : null;
  }
  function bust(url){
    return url + (url.indexOf('?') < 0 ? '?' : '&') + '_=' + Date.now();
  }
  function toast(msg){
    var t = document.createElement('div');
    t.className = 'wl-toast';
    t.textContent = msg;
    document.body.appendChild(t);
    requestAnimationFrame(function(){ t.style.opacity = '1'; });
    return t;
  }
  function hardReload(tagStr){
    try { sessionStorage.setItem('wl_upd', String(Date.now())); } catch (e){}
    location.replace(SELF + '?v=' + encodeURIComponent(tagStr || Date.now()));
  }

  // 手動：把 Cache Storage、Service Worker 全清掉再重載
  window.whiteLightForceUpdate = function(){
    toast('更新中…');
    var jobs = [];
    if (window.caches && caches.keys){
      jobs.push(caches.keys().then(function(keys){
        return Promise.all(keys.map(function(k){ return caches.delete(k); }));
      }));
    }
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
      jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.map(function(r){ return r.unregister(); }));
      }));
    }
    Promise.all(jobs).catch(function(){}).then(function(){
      hardReload('force-' + Date.now());
    });
  };

  // 自動備援：比對版本，有新版就自己更新
  function check(){
    if (!BUILD) return;
    if (!navigator.onLine) return;
    try {
      if (Date.now() - (+sessionStorage.getItem('wl_upd') || 0) < 6000) return;
    } catch (e){}
    fetch(bust(SELF), { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.text() : null; })
      .then(function(text){
        if (!text) return;
        var latest = latestBuildFrom(text);
        if (latest && latest !== BUILD){
          toast('已有新版本，更新中…');
          setTimeout(function(){ hardReload(latest); }, 400);
        }
      })
      .catch(function(){});
  }

  check();
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') check();
  });
})();
</script>
<!-- ================== 白光 自動更新（結束）================== -->
</body>
</html>
